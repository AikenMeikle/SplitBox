<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Divly University of Birmingham Bulk Grocery Co-Op">
  <defs>
    <linearGradient id="divly-social-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="55%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="divly-social-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Emerald Backdrop (safe inside circular WhatsApp/Instagram crop) -->
  <rect width="512" height="512" rx="112" fill="url(#divly-social-bg)" />
  <circle cx="256" cy="256" r="228" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2" />

  <!-- Centered Split Grocery Tote Mark -->
  <g transform="translate(156, 86)">
    <!-- Handle -->
    <path
      d="M 64 56 V 40 A 36 36 0 0 1 136 40 V 56"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="14"
      stroke-linecap="round"
    />
    <!-- Left share -->
    <path
      d="M 24 64 H 94 V 184 H 46 A 22 22 0 0 1 24 162 Z"
      fill="url(#divly-social-tile)"
    />
    <!-- Bottom-right share -->
    <path
      d="M 108 128 H 176 V 162 A 22 22 0 0 1 154 184 H 108 Z"
      fill="#FFFFFF"
      opacity="0.92"
    />
    <!-- Popped top-right share -->
    <rect x="112" y="54" width="68" height="56" rx="15" fill="#ECFDF5" />
    <path
      d="M 132 82 L 143 93 L 162 72"
      fill="none"
      stroke="#059669"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Crisp Divly Wordmark -->
  <text
    x="256"
    y="358"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="84"
    font-weight="800"
    letter-spacing="0.025em"
    fill="#FFFFFF"
  >Div<tspan fill="#A7F3D0">ly</tspan></text>

  <!-- Campus Subtitle Pill -->
  <rect x="108" y="388" width="296" height="44" rx="22" fill="#064E3B" fill-opacity="0.65" stroke="#A7F3D0" stroke-opacity="0.4" stroke-width="1.5" />
  <text
    x="256"
    y="416"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="18"
    font-weight="700"
    letter-spacing="0.09em"
    fill="#ECFDF5"
  >UOB BULK GROCERIES</text>
</svg>
