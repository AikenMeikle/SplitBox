<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Divly Icon">
  <defs>
    <linearGradient id="divly-emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Rounded Emerald App Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#divly-emerald)" />

  <!-- Minimalist Grocery Bag Handle -->
  <path
    d="M 24 22 V 18 A 8 8 0 0 1 40 18 V 22"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Shared Bulk Parcel / Grocery Bag Split cleanly into student shares -->
  <!-- Left half of bag -->
  <path
    d="M 16 23 H 30 V 49 H 21 A 5 5 0 0 1 16 44 Z"
    fill="#FFFFFF"
  />
  <!-- Bottom-right share -->
  <path
    d="M 34 37 H 48 V 44 A 5 5 0 0 1 43 49 H 34 Z"
    fill="#FFFFFF"
    opacity="0.92"
  />
  <!-- Popped top-right individual student share -->
  <rect
    x="35"
    y="21"
    width="15"
    height="12"
    rx="3.5"
    fill="#ECFDF5"
  />
  <path
    d="M 39.5 27 L 41.8 29.3 L 46 25"
    fill="none"
    stroke="#059669"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
