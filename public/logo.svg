<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 56" width="212" height="56" role="img" aria-label="Divly">
  <defs>
    <linearGradient id="divly-logo-emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Crisp Emerald Rounded Square Icon -->
  <g transform="translate(2, 4)">
    <rect x="0" y="0" width="48" height="48" rx="13" fill="url(#divly-logo-emerald)" />
    <path
      d="M 18 16.5 V 13.5 A 6 6 0 0 1 30 13.5 V 16.5"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.8"
      stroke-linecap="round"
    />
    <path
      d="M 11.5 17.5 H 22.5 V 37.5 H 15.5 A 4 4 0 0 1 11.5 33.5 Z"
      fill="#FFFFFF"
    />
    <path
      d="M 25.5 28.5 H 36.5 V 33.5 A 4 4 0 0 1 32.5 37.5 H 25.5 Z"
      fill="#FFFFFF"
      opacity="0.92"
    />
    <rect x="26.5" y="16" width="11.5" height="9.5" rx="2.8" fill="#ECFDF5" />
    <path
      d="M 29.8 20.8 L 31.6 22.6 L 34.8 19.2"
      fill="none"
      stroke="#059669"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Crisp Wordmark with generous kerning so single 'v' reads unmistakably as Divly -->
  <text
    x="62"
    y="38"
    font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="31"
    font-weight="800"
    letter-spacing="0.02em"
    fill="#111827"
  >Div<tspan fill="#059669">ly</tspan></text>
</svg>
